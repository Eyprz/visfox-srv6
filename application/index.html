<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      Self-hosted fonts (public/fonts/fonts.css). Loaded as a static stylesheet, outside the Tailwind / Vite
      pipeline, so the @font-face rules are never re-injected (which would refetch fonts and hide text).
      The Latin files used on every screen are preloaded.
    -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <link rel="preload" href="/fonts/play/play-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/play/play-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VISFOX-SRv6</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
