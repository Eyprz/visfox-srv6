# Go models from the App <-> IEL contract (go generate ./... or: go tool oapi-codegen -config oapi-codegen.yaml ../api/openapi.yaml)
package: apitypes
generate:
  models: true
output: ../api/generated/go/types.gen.go
output-options:
  skip-prune: true
compatibility:
  always-prefix-enum-values: true
