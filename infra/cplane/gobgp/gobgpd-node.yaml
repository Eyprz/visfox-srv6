# GoBGP for the local C-Plane lab, node-SID feed (VISFOX_POLA_TED=node): the BGP-LS collector of the
# second stand-in speaker (infra/cplane/fakebgpls with FAKEBGPLS_SIDS=node, 172.31.77.6), which
# advertises every node with its node SIDs only. Pola reads its TED from here (polad-node.yaml) for
# dynamic paths; the IEL keeps the full feed (gobgpd.yaml). Pola follows routes received from peers
# (adj-in), not routes added to GoBGP's own RIB.
global:
  config:
    as: 65000
    router-id: "172.31.77.5"
neighbors:
  - config:
      neighbor-address: "172.31.77.6"
      peer-as: 65000
    transport:
      config:
        passive-mode: true
    afi-safis:
      - config:
          afi-safi-name: ls
